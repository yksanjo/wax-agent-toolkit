[project]
name = "wax-agent-toolkit"
version = "0.1.0"
description = "Python toolkit for building AI agents on the WAX blockchain — NFT ops, token transfers, DEX integration, account management"
authors = [{ name = "Yoshi Kondo", email = "yoshi@musicailab.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.urls]
"Homepage" = "https://github.com/yksanjo/wax-agent-toolkit"
"Repository" = "https://github.com/yksanjo/wax-agent-toolkit"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wax_agent_toolkit*"]
